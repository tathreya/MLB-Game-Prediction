<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Prediction Platform</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    #gamesContainer table td:nth-child(1) { width: 19%; }  /* Date/Time */
    #gamesContainer table td:nth-child(2) { width: 20%; }  /* Away Team */
    #gamesContainer table td:nth-child(3) { width: 9%; }  /* Away Odds */
    #gamesContainer table td:nth-child(4) { width: 20%; }  /* Home Team */
    #gamesContainer table td:nth-child(5) { width: 9%; }  /* Home Odds */
    #gamesContainer table td:nth-child(6) { width: 23%; }  /* Prediction */

    /* Make sure long prediction text wraps */
    #gamesContainer table td:last-child {
        white-space: normal;
        word-wrap: break-word;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #1E1E2F 0%, #2C2C3E 100%);
        min-height: 100vh;
        padding: 20px;
        color: #E5E7EB;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
        font-size: clamp(2.5rem, 5vw, 4rem);
        font-weight: 800;
        background: linear-gradient(135deg, #A3E635, #84CC16);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    #runButton {
        display: block;
        margin: 0 auto 30px;
        padding: 16px 32px;
        background: linear-gradient(135deg, #A3E635, #84CC16);
        color: #1E1E2F;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 600;
        font-size: 16px;
        transition: all 0.3s ease;
    }
    #runButton:hover {
        background: linear-gradient(135deg, #84CC16, #65A30D);
        transform: translateY(-2px);
    }

    #gamesContainer {
        display: none; /* hide initially */
        background: rgba(30,30,47,0.5);
        backdrop-filter: blur(15px);
        border-radius: 16px;
        padding: 2rem;
        margin-top: 20px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(30,30,47,0.9);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        color: #E5E7EB;
    }

    th, td {
        padding: 12px 15px;
        text-align: left;
    }

    thead {
        background: linear-gradient(135deg, #11121A, #1E1E2F);
        color: #A3E635;
        font-weight: 700;
    }

    tr:nth-child(even) {
        background: rgba(255,255,255,0.05);
    }

    td div {
        display: flex;
        align-items: center;
    }

    img.team-logo {
        width: 40px;
        height: 40px;
        object-fit: contain;
        margin-right: 8px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    input[type="text"] {
        width: 80px;
        padding: 8px;
        border-radius: 8px;
        text-align: center;
        border: 1px solid #A3E635;
        background: rgba(255,255,255,0.1);
        color: #E5E7EB;
    }

    input[type="text"]:focus {
        outline: none;
        box-shadow: 0 0 6px #A3E635;
    }

    button.predict-btn {
        padding: 8px 12px;
        background: linear-gradient(135deg, #A3E635, #84CC16);
        color: #1E1E2F;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 600;
    }
    button.predict-btn:hover {
        background: linear-gradient(135deg, #84CC16, #65A30D);
    }
    
    .action-btn {
        background: linear-gradient(135deg, #A3E635, #84CC16); 
        color: #1E1E2F; 
        border: none; 
        padding: 16px 32px; 
        border-radius: 12px; 
        cursor: pointer; 
        font-weight: 600; 
        font-size: 16px; 
        transition: all 0.3s ease;
    }
    .action-btn:hover {
        background: linear-gradient(135deg, #84CC16, #65A30D);
        transform: translateY(-2px);
    }
    .action-btn:disabled {
        background: #555;
        color: #999;
        cursor: not-allowed;
        transform: none;
    }

    .prediction-output {
        margin-top: 12px;
        font-size: 14px;
        padding: 12px;
        border-radius: 8px;
        display: inline-block;
        background: rgba(163,230,53,0.1);
        border: 1px solid #A3E635;
        color: #A3E635;
        font-weight: 600;
    }

    /* Responsive */
    @media (max-width: 768px) {
        body {
            padding: 10px;
        }

        table {
            font-size: 13px;
        }

        th, td {
            padding: 10px 8px;
        }

        img.team-logo {
            width: 32px;
            height: 32px;
        }

        input[type="text"] {
            width: 60px;
            padding: 6px;
        }

        #runButton, button.predict-btn, .action-btn {
            padding: 10px 16px;
            font-size: 14px;
        }
    }
</style>

<script>
async function runPipeline() {
    const button = document.getElementById('runButton');
    button.disabled = true;
    button.innerText = "Running...";

    try {
        const response = await fetch('/run-pipeline', { method: 'POST' });
        const result = await response.json();

        if(result.status === "success") {
            button.style.display = "none"; 
            fetchGames();
            document.getElementById('gamesContainer').style.display = "block"; 
        } else {
            button.disabled = false;
            button.innerText = "Run the Model for Today";
            alert(result.message);
        }
    } catch (err) {
        button.disabled = false;
        button.innerText = "Run the Model for Today";
        alert("Error running pipeline");
    }
}

async function fetchGames() {
    const response = await fetch('/fetch-games');
    const games = await response.json();

    const container = document.getElementById('gamesContainer');
    container.innerHTML = "";

    const table = document.createElement('table');

    // Header
    const header = table.insertRow();
    ["Date/Time (EST)", "Away Team", "Away Odds", "Home Team", "Home Odds", "Prediction"].forEach(h => header.insertCell().innerText = h);
    
    // Action Buttons Row (Scrape Odds & Predict All)
    const buttonRow = table.insertRow();
    const buttonCell = buttonRow.insertCell();
    buttonCell.colSpan = "6";
    buttonCell.style.textAlign = "center";
    buttonCell.style.paddingBottom = "20px";
    buttonCell.innerHTML = `
        <div style="display: flex; justify-content: center; gap: 15px;">
            <button id="scrapeOddsButton" class="action-btn" onclick="scrapeOdds()">Scrape Odds for Today</button>
            <button id="predictAllButton" class="action-btn" onclick="predictAll()">Predict All Games</button>
        </div>
    `;

    games.forEach(game => {
        const row = table.insertRow();

        // Date/Time
        const dt = new Date(game.date_time);
        let dateStr = dt.toLocaleString("en-US", { timeZone: "America/New_York" });
        if (game.double_header === "DH-2") dateStr += " ⚠️ DOUBLE HEADER";
        row.insertCell().innerText = dateStr;

        // Away Team + Logo
        const awayCell = row.insertCell();
        awayCell.innerHTML = `
            <div style="display:flex; align-items:center;">
                <img src="${game.away_logo}" style="width:40px; height:40px; object-fit:contain; margin-right:8px;">
                <span>${game.away_team}</span>
            </div>
        `;

        // Away Odds
        row.insertCell().innerHTML = `<input type="text" class="away-odds" data-gameid="${game.game_id}" data-away="${game.away_team}" data-home="${game.home_team}">`;

        // Home Team + Logo
        const homeCell = row.insertCell();
        homeCell.innerHTML = `
            <div style="display:flex; align-items:center;">
                <img src="${game.home_logo}" style="width:40px; height:40px; object-fit:contain; margin-right:8px;">
                <span>${game.home_team}</span>
            </div>
        `;

        // Home Odds
        row.insertCell().innerHTML = `<input type="text" class="home-odds" data-gameid="${game.game_id}">`;

        // Prediction button/output
        row.insertCell().innerHTML = `
            <button class="predict-btn" onclick="calculatePrediction(${game.game_id})">Predict</button>
            <div class="prediction-output" id="prediction_${game.game_id}" style="display:none;"></div>
        `;
    });

    container.appendChild(table);
    container.style.display = "block";  
}

function validateOdds(odds) {
    return (
        typeof odds === 'string' &&
        (odds.startsWith('+') || odds.startsWith('-')) &&
        odds.length >= 4 &&
        /^\d+$/.test(odds.slice(1))
    );
}

async function scrapeOdds() {
    const button = document.getElementById('scrapeOddsButton');
    button.disabled = true;
    button.innerText = "Scraping...";
    
    try {
        const response = await fetch('/scrape-odds', { method: 'POST' });
        const result = await response.json();
        
        if(result.status === "success") {
            // Populate odds inputs with scraped data
            result.games.forEach(game => {
                const awayInput = document.querySelector(`.away-odds[data-gameid='${game.game_id}']`);
                const homeInput = document.querySelector(`.home-odds[data-gameid='${game.game_id}']`);
                
                if (awayInput && game.away_odds !== null) {
                    awayInput.value = game.away_odds > 0 ? `+${game.away_odds}` : `${game.away_odds}`;
                }
                if (homeInput && game.home_odds !== null) {
                    homeInput.value = game.home_odds > 0 ? `+${game.home_odds}` : `${game.home_odds}`;
                }
            });
            
            button.innerText = "Odds Scraped Successfully!";
            setTimeout(() => {
                button.innerText = "Scrape Odds for Today";
                button.disabled = false;
            }, 2000);
        } else {
            button.innerText = "Scrape Odds for Today";
            button.disabled = false;
            alert(`Failed to scrape odds: ${result.message}`);
        }
    } catch (err) {
        button.innerText = "Scrape Odds for Today";
        button.disabled = false;
        alert("Error scraping odds");
        console.error("Scrape error:", err);
    }
}

async function calculatePrediction(game_id) {
    const homeInput = document.querySelector(`.home-odds[data-gameid='${game_id}']`).value;
    const awayInput = document.querySelector(`.away-odds[data-gameid='${game_id}']`).value;

    if(!validateOdds(homeInput) || !validateOdds(awayInput)) {
        alert("Enter valid odds like +150 or -120");
        return;
    }

    const response = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game_id, home_odds: homeInput, away_odds: awayInput })
    });

    const result = await response.json();
    const outputDiv = document.getElementById(`prediction_${game_id}`);
    if(result.status === "success") {
        outputDiv.innerText = `Take ${result.teamToBetOn}, Unit Size: ${result.unit_size.toFixed(2)}, ROI: ${result.expected_roi.toFixed(2)}%`;
        outputDiv.style.display = 'block';
        return {
            status: "success",
            game_id: game_id,
            teamToBetOn: result.teamToBetOn,
            unit_size: result.unit_size,
            expected_roi: result.expected_roi
        };
    } else {
        outputDiv.innerText = result.message || "Prediction failed";
        outputDiv.style.display = 'block';
        console.error("Prediction error:", result);
        return { status: "error" };
    }
}

async function predictAll() {
    const btn = document.getElementById('predictAllButton');
    btn.disabled = true;
    btn.innerText = "Predicting All Games...";

    const awayInputs = document.querySelectorAll('.away-odds');
    let sweetSpotPlays = [];

    // Run all predictions in parallel
    const promises = Array.from(awayInputs).map(async (awayInput) => {
        const game_id = awayInput.getAttribute('data-gameid');
        const awayTeam = awayInput.getAttribute('data-away');
        const homeTeam = awayInput.getAttribute('data-home');
        
        const homeInput = document.querySelector(`.home-odds[data-gameid='${game_id}']`);
        
        // Skip empty or invalid odds
        if(!validateOdds(homeInput.value) || !validateOdds(awayInput.value)) {
            const out = document.getElementById(`prediction_${game_id}`);
            out.innerText = "Invalid/Missing odds";
            out.style.display = 'block';
            return;
        }

        const result = await calculatePrediction(game_id);

        // Filter for sweet spot (ROI >= 35 and <= 65)
        if (result && result.status === "success") {
            if (result.expected_roi >= 35 && result.expected_roi <= 65) {
                sweetSpotPlays.push({
                    matchup: `${awayTeam} vs ${homeTeam}`,
                    bet: result.teamToBetOn,
                    odds: result.teamToBetOn === awayTeam ? awayInput.value : homeInput.value,
                    unit: result.unit_size.toFixed(2),
                    roi: result.expected_roi.toFixed(2)
                });
            }
        }
    });

    await Promise.all(promises);

    // Build the text file content
    let textContent = "SWEET SPOT PLAYS (ROI 35% - 65%):\n\n";
    if (sweetSpotPlays.length === 0) {
        textContent += "No plays found in the sweet spot range today.\n";
    } else {
        sweetSpotPlays.forEach(play => {
            textContent += `${play.matchup} --> Bet on: ${play.bet} @ ${play.odds} | Unit: ${play.unit} | ROI: ${play.roi}%\n`;
        });
    }

    // Generate UI Textbox
    generateSweetSpotBox(textContent);

    // Reset button
    btn.innerText = "Predict All Games";
    btn.disabled = false;
}

function generateSweetSpotBox(textContent) {
    let container = document.getElementById('sweetSpotContainer');
    if (!container) {
        container = document.createElement('div');
        container.id = 'sweetSpotContainer';
        container.style.marginTop = '20px';
        container.style.background = 'rgba(30,30,47,0.9)';
        container.style.padding = '20px';
        container.style.borderRadius = '12px';
        document.getElementById('gamesContainer').appendChild(container);
    }
    
    container.innerHTML = `
        <h3 style="color: #A3E635; margin-bottom: 15px;">Sweet Spot Plays (Ready to Copy)</h3>
        <textarea id="sweetSpotText" style="width: 100%; height: 180px; background: rgba(0,0,0,0.3); color: #E5E7EB; border: 1px solid #A3E635; border-radius: 8px; padding: 10px; font-family: monospace; resize: none;">${textContent}</textarea>
        <button onclick="copySweetSpotText()" style="margin-top: 10px; padding: 10px 20px; background: #A3E635; color: #1E1E2F; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: all 0.3s ease;">Copy to Clipboard</button>
    `;
    
    // Scroll down to show it
    container.scrollIntoView({ behavior: 'smooth' });
}

function copySweetSpotText() {
    const txt = document.getElementById('sweetSpotText');
    txt.select();
    document.execCommand('copy');
    alert('Copied to clipboard!');
}

</script>
</head>
<body>
<h1>MLB Prediction Platform</h1>
<button id="runButton" onclick="runPipeline()">Run Model for Today</button>
<div id="gamesContainer"></div>
</body>
</html>
