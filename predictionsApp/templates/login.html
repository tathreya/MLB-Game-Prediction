<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MLB Prediction Login</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #1E1E2F 0%, #2C2C3E 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #E5E7EB;
    }
    .login-container {
        background: rgba(30,30,47,0.8);
        backdrop-filter: blur(15px);
        padding: 3rem 2rem;
        border-radius: 16px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        width: 100%;
        max-width: 400px;
        text-align: center;
    }
    h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        font-weight: 800;
        background: linear-gradient(135deg, #A3E635, #84CC16);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 2rem;
        text-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    input[type="text"], input[type="password"] {
        width: 80%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #A3E635;
        background: rgba(255,255,255,0.1);
        color: #E5E7EB;
        font-size: 1rem;
    }
    input:focus {
        outline: none;
        box-shadow: 0 0 6px #A3E635;
    }
    button {
        width: 85%;
        padding: 14px;
        margin-top: 1rem;
        background: linear-gradient(135deg, #A3E635, #84CC16);
        color: #1E1E2F;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    button:hover {
        background: linear-gradient(135deg, #84CC16, #65A30D);
        transform: translateY(-2px);
    }
    .error {
        margin-top: 1rem;
        color: #F87171;
        font-weight: 600;
    }
    @media (max-width: 480px) {
        .login-container { padding: 2rem 1rem; }
        input[type="text"], input[type="password"], button { width: 90%; }
    }
</style>
</head>
<body>
    <div class="login-container">
        <h1>MLB Prediction Application</h1>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required
                value="{{ request.form.username or '' }}"><br>
            <input type="password" name="password" placeholder="Password" required><br>
            <button type="submit">Login</button>
        </form>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
